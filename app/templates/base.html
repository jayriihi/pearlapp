<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      const pearlScrollResetKey = 'pearl_scroll_to_top_after_refresh';

      if (sessionStorage.getItem(pearlScrollResetKey)) {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

        window.addEventListener('pageshow', function() {
          window.scrollTo(0, 0);
          window.requestAnimationFrame(function() {
            window.scrollTo(0, 0);
            if ('scrollRestoration' in history) history.scrollRestoration = 'auto';
          });
          sessionStorage.removeItem(pearlScrollResetKey);
        }, { once: true });
      }

      window.refreshPearlPage = function() {
        if (window.pearlRefreshPending) return;
        window.pearlRefreshPending = true;

        sessionStorage.setItem(pearlScrollResetKey, '1');
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        window.scrollTo(0, 0);

        const viewport = document.querySelector('meta[name="viewport"]');

        if (!viewport) {
          window.location.reload();
          return;
        }

        const normalViewport = viewport.dataset.pearlNormalViewport ||
          viewport.getAttribute('content') || 'width=device-width, initial-scale=1';
        viewport.dataset.pearlNormalViewport = normalViewport;
        viewport.setAttribute('content', `${normalViewport}, maximum-scale=1`);

        window.setTimeout(function() {
          window.location.reload();
        }, 50);
      };
    </script>
    <title>{% block title %}Live Winds - Upwind Sports{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}?v=8">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32x32.png') }}?v=8">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='icons/favicon-16x16.png') }}?v=8">

    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-logo-180x180_v3.png') }}?v=8">
    <link rel="apple-touch-icon" sizes="167x167" href="{{ url_for('static', filename='icons/apple-touch-logo-167x167_v3.png') }}?v=8">
    <link rel="apple-touch-icon" sizes="152x152" href="{{ url_for('static', filename='icons/apple-touch-logo-152x152_v3.png') }}?v=8">
    <link rel="apple-touch-icon" sizes="120x120" href="{{ url_for('static', filename='icons/apple-touch-logo-120x120_v3.png') }}?v=8">

    <meta name="apple-mobile-web-app-title" content="Live winds">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BTFXTC61KN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-BTFXTC61KN');
    </script>

    <style>
      .navbar{
        padding-top: .25rem;
        padding-bottom: .25rem;
        min-height: 44px;
      }
      .navbar-brand{ margin-right: .5rem; }
      .navbar-brand img{
        height: 40px;
        width: auto;
        display: block;
      }
      .navbar-nav .nav-link{
        padding: .25rem .6rem;
        line-height: 1.2;
        font-size: 1.5rem;
      }
      .navbar-toggler{
        padding: .2rem .4rem;
        font-size: 1rem;
      }

      @media (max-width: 430px){
        .navbar{ padding-top: 2px; padding-bottom: 2px; }
        .navbar-brand img{ height: 36px; }
        .navbar-nav .nav-link{ padding: .35rem .5rem; font-size: 1rem; }
        .nav-set{
          flex-direction: row;
          align-items: center;
          gap: 12px;
          margin: 0 auto;
          max-width: 280px;
          padding-left: 6px;
        }
        .navbar-brand{ margin-right: 0; }
        .navbar-nav{
          align-items: flex-start !important;
          text-align: left;
        }
      }

      .topbar { padding-block: 2px; }
      .brand-img {
        height: 24px;
        display:block;
        border-radius: 6px;
        border: 1px solid rgba(96, 96, 96, .45);
      }

      @media (min-width: 992px){
        .navbar-nav.gap-lg-3 { gap: .9rem !important; }
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light topbar">
      <div class="container">
        <button class="navbar-toggler ms-auto" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-center" id="mainNav">
          <div class="nav-set d-flex align-items-center gap-3 mx-auto">
            <a class="navbar-brand p-0" href="{{ url_for('upwindsports') }}">
              <img src="{{ url_for('static', filename='upwinds_logo.jpg') }}" alt="Upwind Sports" class="brand-img">
            </a>

            <ul class="navbar-nav flex-column flex-lg-row align-items-center gap-lg-3">
              <li class="nav-item"><a class="nav-link" href="/">Past hour</a></li>
              <li class="nav-item"><a class="nav-link" href="/windput">Session</a></li>
              <li class="nav-item"><a class="nav-link" href="/tidal_flow">Tidal flow</a></li>
              <li class="nav-item"><a class="nav-link" href="/dewpointplus">Dew point</a></li>
              <li class="nav-item"><a class="nav-link" href="https://www.windguru.cz/32728" target="_blank" rel="noopener">Windguru</a></li>
              <li class="nav-item"><a class="nav-link" href="http://weather.bm/tools/graphics.asp?name=250KM%20SRI&user=" target="_blank" rel="noopener">BDA Radar</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const nav = document.getElementById('mainNav');
        if (!nav) return;

        nav.querySelectorAll('.nav-link').forEach(a => {
          a.addEventListener('click', () => {
            const inst = bootstrap.Collapse.getOrCreateInstance(nav, { toggle: false });
            inst.hide();
          });
        });
      });

      window.addEventListener('pageshow', () => {
        setTimeout(() => {
          const bodyText = document.body.innerText.trim();
          if (bodyText.length < 20 && !sessionStorage.getItem('pearl_reload_once')) {
            console.warn('Blank screen detected, forcing reload');
            sessionStorage.setItem('pearl_reload_once', '1');
            window.refreshPearlPage();
          }
        }, 1200);
      });

      window.addEventListener('load', () => {
        sessionStorage.removeItem('pearl_reload_once');
      });

      window.addEventListener('error', (e) => {
        console.error('Global JS error:', e.message, e.filename, e.lineno);
      });

      window.addEventListener('unhandledrejection', (e) => {
        console.error('Unhandled promise rejection:', e.reason);
      });
    </script>
  </body>
</html>
