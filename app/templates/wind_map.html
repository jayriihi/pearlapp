<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2033">
  <meta name="apple-mobile-web-app-title" content="Live winds">
  <title>Bermuda live wind map · Pearl</title>
  {% include "_analytics.html" %}
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-logo-180x180_v3.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='wind-map/map.css') }}">
</head>
<body>
  <div class="map-page">
    <header class="map-header">
      <a class="back-link" id="back-to-pearl" href="/winds/1"><span aria-hidden="true">←</span> Back to Pearl</a>
      <div class="heading"><span class="wordmark">PEARL</span><h1>Bermuda live wind map</h1></div>
      <button class="preview-badge mode-toggle" id="wind-mode-toggle" type="button" aria-controls="explore-controls" aria-expanded="false">Explore</button>
    </header>
    <main class="map-stage" aria-label="Bermuda wind direction map">
      <div id="bermuda-map" aria-label="Map of Bermuda. Use arrow keys to pan and plus or minus to zoom."></div>
      <div class="map-intro">
        <span id="wind-state" role="status">PEARL · CONNECTING</span>
        <span id="wind-reading">Loading observation…</span>
        <span id="wind-age"></span>
      </div>
      <div id="explore-controls" class="explore-controls" hidden>
        <div id="direction-dial" class="direction-dial" role="slider" tabindex="0" aria-label="Hypothetical wind direction from" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0">
          <svg viewBox="0 0 136 136" aria-hidden="true">
            <circle class="dial-face" cx="68" cy="68" r="65"/>
            <circle class="dial-ticks" cx="68" cy="68" r="46"/>
            <text x="68" y="16">N</text><text x="123" y="72">E</text><text x="68" y="128">S</text><text x="13" y="72">W</text>
            <g id="dial-needle"><path d="M68 68V29"/><circle cx="68" cy="26" r="5"/></g>
            <circle class="dial-centre" cx="68" cy="68" r="3"/>
            <text class="dial-hint" x="68" y="94">FROM</text>
          </svg>
        </div>
        <div class="direction-slider">
          <label class="sr-only" for="direction-range">Hypothetical wind direction from</label>
          <input id="direction-range" type="range" min="0" max="359.999999" step="any" value="0">
          <div class="slider-points" aria-hidden="true"><span>N</span><span>E</span><span>S</span><span>W</span><span>N</span></div>
        </div>
      </div>
      <div class="north" aria-label="North is at the top"><b>N</b><svg viewBox="0 0 24 38" aria-hidden="true"><path d="M12 2 22 32 12 26 2 32Z"/></svg></div>
      <div class="map-actions" aria-label="Map controls">
        <button id="show-bermuda" type="button" disabled>Show Bermuda</button>
        <div class="zoom-controls"><button id="zoom-in" aria-label="Zoom in" disabled>+</button><button id="zoom-out" aria-label="Zoom out" disabled>−</button></div>
      </div>
      <div class="map-message" id="map-message" role="status"><span id="map-message-text">Loading Bermuda…</span><button id="retry-map" type="button" hidden>Try again</button></div>
      <div class="map-scale" id="map-scale" aria-hidden="true"></div>
    </main>
    <footer class="map-footer">
      <details class="map-explanation"><summary class="preview-note"><span class="station-dot" aria-hidden="true"></span><strong>Pearl Island station</strong><span aria-label="About this visualization">ⓘ</span></summary><p>Direction shown uniformly across Bermuda. Local conditions vary.</p></details>
      <div class="map-credit"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a><a href="{{ url_for('wind_map.geography') }}">Map data ↓</a></div>
    </footer>
  </div>
  <noscript><p class="no-script">Enable JavaScript to view the map. <a href="/winds/1">Back to Pearl</a></p></noscript>
  <script id="map-config" type="application/json">{{ {'station': station, 'dataUrl': url_for('static', filename='wind-map/data/'), 'observationUrl': url_for('wind_map.observation'), 'pollSeconds': poll_seconds, 'staleSeconds': stale_seconds} | tojson }}</script>
  <script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
  <script src="{{ url_for('static', filename='wind-map/wind.js') }}" defer></script>
  <script src="{{ url_for('static', filename='wind-map/live.js') }}" defer></script>
  <script src="{{ url_for('static', filename='wind-map/map.js') }}" defer></script>
</body>
</html>
