<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Maintenance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f9fafb;
      color: #111827;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 32px 28px 28px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }

    .logo-wrap {
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: slow-spin 12s linear infinite;
    }

    /* Respect reduced motion preferences */
    @media (prefers-reduced-motion: reduce) {
      .logo-wrap img {
        animation: none;
      }
    }

    @keyframes slow-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    h1 {
      margin: 14px 0 10px;
      font-size: 24px;
      font-weight: 600;
    }

    p {
      margin: 8px 0;
      color: #374151;
      line-height: 1.6;
      font-size: 16px;
    }

    .meta {
      margin-top: 18px;
      font-size: 14px;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <div class="logo-wrap">
        <img src="{{ url_for('static', filename='icons/apple-touch-logo-1024x1024_v3.png') }}"
             alt="Pearl logo">
      </div>

      <h1>Rigging adjustments in progress</h1>

      <p>
        The site is temporarily offline while we tidy things up.
      </p>
      <p>
        Back shortly — winds permitting.
      </p>

      <div class="meta">
        Status: maintenance mode
      </div>

    </div>
  </div>
</body>
</html>
